<app-navbar></app-navbar>

<div
    class="register-container d-flex align-items-center justify-content-center"
    style="background-image: url('assets/images/Registro-fondo.jpg'); background-size: cover; background-position: center; min-height: 100vh; padding: 2rem;">

    <div class="auth-form bg-white p-4 rounded shadow-lg" style="max-width: 480px; width: 100%;">
        <h2 class="text-center mb-4 fade-in">Registro de Cliente</h2>

        <form (ngSubmit)="onSubmit()" #registerForm="ngForm" class="slide-up">
            <div class="mb-4 form-floating">
                <input type="text" class="form-control" id="fullName" [(ngModel)]="fullName" name="fullName" placeholder="Nombre Completo" required #fullNameInput="ngModel">
                <label for="fullName">Nombre Completo</label>
                <div *ngIf="fullNameInput.invalid && (fullNameInput.dirty || fullNameInput.touched)" class="text-danger small mt-1">
                    <div *ngIf="fullNameInput.errors?.['required']">El nombre es requerido</div>
                </div>
            </div>

            <div class="mb-4 form-floating">
              <select class="form-select" id="sexo" [(ngModel)]="sexo" name="sexo" required #sexoInput="ngModel">
                  <option value="" disabled selected>Seleccione su sexo</option>
                  <option value="MASCULINO">Masculino</option>
                  <option value="FEMENINO">Femenino</option>
                  <option value="OTRO">Otro</option>
              </select>
              <label for="sexo">Sexo</label>
              <div *ngIf="sexoInput.invalid && (sexoInput.dirty || sexoInput.touched)" class="text-danger small mt-1">
                  <div *ngIf="sexoInput.errors?.['required']">El sexo es requerido</div>
              </div>
          </div>


            <div class="mb-4 form-floating">
                <input type="email" class="form-control" id="email" [(ngModel)]="email" name="email" placeholder="nombre@ejemplo.com" required #emailInput="ngModel">
                <label for="email">Correo electrónico</label>
                <div *ngIf="emailInput.invalid && (emailInput.dirty || emailInput.touched)" class="text-danger small mt-1">
                    <div *ngIf="emailInput.errors?.['required']">El correo electrónico es requerido</div>
                </div>
            </div>

            <div class="mb-4 form-floating position-relative">
                <input [type]="showPassword ? 'text' : 'password'" class="form-control" id="password" [(ngModel)]="password" name="password" placeholder="Contraseña" required #passwordInput="ngModel">
                <label for="password">Contraseña</label>
                <button type="button" class="btn btn-link position-absolute top-50 end-0 translate-middle-y me-3" (click)="togglePasswordVisibility()" style="z-index: 2;">
                    <i class="bi" [class]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
                </button>
                <div *ngIf="passwordInput.invalid && (passwordInput.dirty || passwordInput.touched)" class="text-danger small mt-1">
                    <div *ngIf="passwordInput.errors?.['required']">La contraseña es requerida</div>
                </div>
            </div>

            <div class="mb-4 form-floating">
                <input [type]="showPassword ? 'text' : 'password'" class="form-control" id="confirmPassword" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Confirmar Contraseña" required #confirmPasswordInput="ngModel">
                <label for="confirmPassword">Confirmar Contraseña</label>
                <div *ngIf="confirmPasswordInput.invalid && (confirmPasswordInput.dirty || confirmPasswordInput.touched)" class="text-danger small mt-1">
                    <div *ngIf="confirmPasswordInput.errors?.['required']">La confirmación de contraseña es requerida</div>
                </div>
            </div>

            <div class="mb-4 form-check fade-in-delay">
                <input type="checkbox" class="form-check-input" id="terms" [(ngModel)]="acceptTerms" name="terms" required>
                <label class="form-check-label" for="terms">
                    Acepto los <a href="#" class="text-primary hover-link">términos y condiciones</a>
                </label>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-4 btn-scale" [disabled]="!registerForm.form.valid || !acceptTerms">
                <i class="bi bi-person-plus me-2"></i>Registrarse como Cliente
            </button>

            <hr class="my-4">

            <div class="text-center slide-up-delay">
                <p class="mb-3">¿Ya tienes una cuenta?</p>
                <a routerLink="/login" class="btn btn-outline-primary w-100 btn-scale">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
                </a>
            </div>
        </form>
    </div>
</div>

<app-footer></app-footer>
