<app-navbar></app-navbar>

<div
    class="register-container d-flex align-items-center justify-content-center"
    style="background-image: url('assets/images/Registro-fondo.jpg'); background-size: cover; background-position: center; min-height: 100vh; padding: 2rem;">

    <div class="auth-form bg-white p-4 rounded shadow-lg" style="max-width: 480px; width: 100%;">
        <h2 class="text-center mb-4">Registro de Empresa</h2>

        <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
            <div class="mb-3 form-floating">
                <input type="text" class="form-control" id="nombre" [(ngModel)]="nombre" name="nombre" placeholder="Nombre de la Empresa" required>
                <label for="nombre">Nombre de la Empresa</label>
            </div>

            <div class="mb-3 form-floating">
                <input type="email" class="form-control" id="email" [(ngModel)]="email" name="email" placeholder="correo@empresa.com" required>
                <label for="email">Correo electrónico</label>
            </div>

            <div class="mb-3 form-floating">
                <input [type]="showPassword ? 'text' : 'password'" class="form-control" id="password" [(ngModel)]="password" name="password" placeholder="Contraseña" required>
                <label for="password">Contraseña</label>
                <button type="button" class="btn btn-link position-absolute top-50 end-0 translate-middle-y me-3" (click)="togglePasswordVisibility()" style="z-index: 2;">
                    <i class="bi" [class]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
                </button>
            </div>

            <div class="mb-3 form-floating">
                <input [type]="showPassword ? 'text' : 'password'" class="form-control" id="confirmPassword" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Confirmar Contraseña" required>
                <label for="confirmPassword">Confirmar Contraseña</label>
            </div>

            <div class="mb-3 form-floating">
                <input type="text" class="form-control" id="telefono" [(ngModel)]="telefono" name="telefono" placeholder="Teléfono" required>
                <label for="telefono">Teléfono</label>
            </div>

            <div class="mb-3 form-floating">
                <input type="text" class="form-control" id="direccion" [(ngModel)]="direccion" name="direccion" placeholder="Dirección" required>
                <label for="direccion">Dirección</label>
            </div>

            <div class="mb-3 form-floating">
                <input type="text" class="form-control" id="nit" [(ngModel)]="nit" name="nit" placeholder="NIT de la empresa" required>
                <label for="nit">NIT</label>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="terms" [(ngModel)]="acceptTerms" name="terms" required>
                <label class="form-check-label" for="terms">
                    Acepto los <a href="#" class="text-primary">términos y condiciones</a>
                </label>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3" [disabled]="!registerForm.form.valid || !acceptTerms">
                <i class="bi bi-building me-2"></i>Registrarse como Empresa
            </button>

            <div class="text-center">
                <p class="mb-2">¿Ya tienes una cuenta?</p>
                <a routerLink="/login" class="btn btn-outline-primary w-100">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
                </a>
            </div>
        </form>
    </div>
</div>

<app-footer></app-footer>
