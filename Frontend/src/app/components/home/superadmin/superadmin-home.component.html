<app-navbar></app-navbar>

<!-- Page Title -->
<div class="bg-danger text-white py-4 mb-4">
  <div class="container">
    <h1 class="h3 mb-0">Panel de Super Administrador</h1>
  </div>
</div>

<div class="container py-5">
  <div class="row">
    <!-- Personal Information Card -->
    <div class="col-md-4 mb-4">
      <div class="dashboard-card">
        <div class="card-body">
          <div class="card-header">
            <div class="card-icon bg-primary">
              <i class="bi bi-person-fill"></i>
            </div>
            <h3 class="card-title">Información Personal</h3>
          </div>

          <!-- Success/Error Messages -->
          <div *ngIf="successMessage" class="alert alert-success alert-dismissible fade show" role="alert">
            {{ successMessage }}
            <button type="button" class="btn-close" (click)="successMessage = ''"></button>
          </div>

          <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show" role="alert">
            {{ errorMessage }}
            <button type="button" class="btn-close" (click)="errorMessage = ''"></button>
          </div>

          <form (ngSubmit)="updateProfile()" #profileForm="ngForm">
            <div class="mb-3">
              <label class="form-label">Nombre completo</label>
              <input
                type="text"
                class="form-control"
                [(ngModel)]="adminData.nombre"
                name="nombre"
                [readonly]="!isEditing">
            </div>

            <div class="mb-3">
              <label class="form-label">Correo electrónico</label>
              <input
                type="email"
                class="form-control"
                [(ngModel)]="adminData.email"
                name="email"
                [readonly]="!isEditing">
            </div>

            <div class="d-flex gap-2">
              <button
                type="button"
                class="btn btn-outline-primary flex-grow-1"
                (click)="toggleEdit()">
                <i class="bi" [class]="isEditing ? 'bi-x-lg' : 'bi-pencil'"></i>
                {{ isEditing ? 'Cancelar' : 'Editar' }}
              </button>
              <button
                *ngIf="isEditing"
                type="submit"
                class="btn btn-primary flex-grow-1">
                <i class="bi bi-save"></i>
                Guardar
              </button>
            </div>
          </form>

          <hr>

          <!-- Settings Section -->
          <h4 class="mb-3">Configuración</h4>
          <div class="form-check form-switch mb-3">
            <input 
              class="form-check-input" 
              type="checkbox" 
              [(ngModel)]="darkMode"
              (change)="toggleTheme()">
            <label class="form-check-label">Modo Oscuro</label>
          </div>
          <div class="form-check form-switch mb-4">
            <input 
              class="form-check-input" 
              type="checkbox" 
              [(ngModel)]="notificationsEnabled"
              (change)="toggleNotifications()">
            <label class="form-check-label">Notificaciones</label>
          </div>

          <!-- Security Section -->
          <h4 class="mb-3">Seguridad</h4>
          <div class="d-grid gap-2">
            <button class="btn btn-outline-primary">
              <i class="bi bi-key me-2"></i>Cambiar Contraseña
            </button>
            <button class="btn btn-outline-danger">
              <i class="bi bi-trash me-2"></i>Eliminar Cuenta
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Users Management Section -->
    <div class="col-md-8">
      <div class="dashboard-card">
        <div class="card-header">
          <div class="card-icon bg-info">
            <i class="bi bi-people-fill"></i>
          </div>
          <h3 class="card-title">Gestión de Usuarios</h3>
        </div>
        
        <!-- Search and Filter -->
        <div class="mb-4">
          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-search"></i>
            </span>
            <input
              type="text"
              class="form-control"
              placeholder="Buscar usuarios..."
              [(ngModel)]="searchTerm"
              (ngModelChange)="filterUsers()">
          </div>
        </div>

        <!-- Users Table -->
        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let user of filteredUsers">
                <td>{{ user.name }}</td>
                <td>{{ user.email }}</td>
                <td>
                  <span class="badge" [ngClass]="getRoleBadgeClass(user.role)">
                    {{ user.role }}
                  </span>
                </td>
                <td>
                  <div class="btn-group">
                    <button class="btn btn-sm btn-outline-primary" (click)="editUser(user)">
                      <i class="bi bi-pencil"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger" (click)="deleteUser(user)">
                      <i class="bi bi-trash"></i>
                    </button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
