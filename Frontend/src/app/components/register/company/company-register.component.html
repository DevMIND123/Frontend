<app-auth-layout>
  <div class="auth-form">
    <h2 class="text-center mb-4 fade-in">Registro de Empresa</h2>
    
    <form (ngSubmit)="onSubmit()" #registerForm="ngForm" class="slide-up">
      <div class="mb-4 form-floating">
        <input 
          type="text" 
          class="form-control" 
          id="companyName"
          [(ngModel)]="companyName"
          name="companyName"
          placeholder="Nombre de la Empresa"
          required
          #companyNameInput="ngModel">
        <label for="companyName">Nombre de la Empresa</label>
        <div *ngIf="companyNameInput.invalid && (companyNameInput.dirty || companyNameInput.touched)" class="text-danger small mt-1">
          <div *ngIf="companyNameInput.errors?.['required']">El nombre de la empresa es requerido</div>
        </div>
      </div>

      <div class="mb-4 form-floating">
        <input 
          type="text" 
          class="form-control" 
          id="nit"
          [(ngModel)]="nit"
          name="nit"
          placeholder="NIT"
          required
          #nitInput="ngModel">
        <label for="nit">NIT</label>
        <div *ngIf="nitInput.invalid && (nitInput.dirty || nitInput.touched)" class="text-danger small mt-1">
          <div *ngIf="nitInput.errors?.['required']">El NIT es requerido</div>
        </div>
      </div>

      <div class="mb-4 form-floating">
        <input 
          type="email" 
          class="form-control" 
          id="email" 
          [(ngModel)]="email"
          name="email"
          placeholder="correo@empresa.com"
          required
          #emailInput="ngModel">
        <label for="email">Correo electrónico empresarial</label>
        <div *ngIf="emailInput.invalid && (emailInput.dirty || emailInput.touched)" class="text-danger small mt-1">
          <div *ngIf="emailInput.errors?.['required']">El correo electrónico es requerido</div>
        </div>
      </div>

      <div class="mb-4 form-floating">
        <input 
          type="text" 
          class="form-control" 
          id="address"
          [(ngModel)]="address"
          name="address"
          placeholder="Dirección"
          required
          #addressInput="ngModel">
        <label for="address">Dirección</label>
        <div *ngIf="addressInput.invalid && (addressInput.dirty || addressInput.touched)" class="text-danger small mt-1">
          <div *ngIf="addressInput.errors?.['required']">La dirección es requerida</div>
        </div>
      </div>

      <div class="mb-4 form-floating">
        <input 
          type="tel" 
          class="form-control" 
          id="phone"
          [(ngModel)]="phone"
          name="phone"
          placeholder="Teléfono"
          required
          #phoneInput="ngModel">
        <label for="phone">Teléfono</label>
        <div *ngIf="phoneInput.invalid && (phoneInput.dirty || phoneInput.touched)" class="text-danger small mt-1">
          <div *ngIf="phoneInput.errors?.['required']">El teléfono es requerido</div>
        </div>
      </div>

      <div class="mb-4 form-floating">
        <input 
          [type]="showPassword ? 'text' : 'password'"
          class="form-control" 
          id="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Contraseña"
          required
          #passwordInput="ngModel">
        <label for="password">Contraseña</label>
        <button 
          type="button"
          class="btn btn-link password-toggle"
          (click)="togglePasswordVisibility()">
          <i class="bi" [class]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
        </button>
        <div *ngIf="passwordInput.invalid && (passwordInput.dirty || passwordInput.touched)" class="text-danger small mt-1">
          <div *ngIf="passwordInput.errors?.['required']">La contraseña es requerida</div>
        </div>
      </div>

      <div class="mb-4 form-floating">
        <input 
          [type]="showPassword ? 'text' : 'password'"
          class="form-control" 
          id="confirmPassword"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          placeholder="Confirmar Contraseña"
          required
          #confirmPasswordInput="ngModel">
        <label for="confirmPassword">Confirmar Contraseña</label>
        <div *ngIf="confirmPasswordInput.invalid && (confirmPasswordInput.dirty || confirmPasswordInput.touched)" class="text-danger small mt-1">
          <div *ngIf="confirmPasswordInput.errors?.['required']">La confirmación de contraseña es requerida</div>
        </div>
      </div>

      <div class="mb-4 form-check fade-in-delay">
        <input 
          type="checkbox" 
          class="form-check-input" 
          id="terms" 
          [(ngModel)]="acceptTerms" 
          name="terms"
          required>
        <label class="form-check-label" for="terms">
          Acepto los <a href="#" class="text-primary hover-link">términos y condiciones</a>
        </label>
      </div>

      <button 
        type="submit" 
        class="btn btn-primary w-100 mb-4 btn-scale"
        [disabled]="!registerForm.form.valid || !acceptTerms">
        <i class="bi bi-building me-2"></i>Registrar Empresa
      </button>

      <hr class="my-4">

      <div class="text-center slide-up-delay">
        <p class="mb-3">¿Ya tienes una cuenta?</p>
        <a routerLink="/login" class="btn btn-outline-primary w-100 btn-scale">
          <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
        </a>
      </div>
    </form>
  </div>
</app-auth-layout>
